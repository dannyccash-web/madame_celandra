<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120524" />
  <title>Madame Celandra — a tarot reading</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- jsPDF for client-side PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <div id="app">

    <!-- ══════════════════  1 · START SCREEN  ══════════════════ -->
    <section id="start-screen" class="screen active" aria-label="Start">
      <div class="screen-bg start" aria-hidden="true"></div>
      <img class="logo-img" src="madame_celandre_logo.png"
           alt="Madame Celandra — a tarot reading" />

      <button class="btn" id="begin-btn">Begin Reading</button>

      <!-- Shown only when the seeker has already had a reading today -->
      <div class="gate-wrap" id="start-gate" style="display:none;">
        <div class="madame">
          <div class="avatar" aria-hidden="true"></div>
          <div>
            <div class="name">Madame Celandra</div>
            <div class="bubble" id="gate-message"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ══════════════════  2 · QUESTION SCREEN  ══════════════════ -->
    <section id="question-screen" class="screen" aria-label="Your question">
      <div class="screen-bg question" aria-hidden="true"></div>

      <h1>What weighs upon your heart?</h1>

      <!-- bottom-docked cluster: Madame's dialog, the input, and the buttons -->
      <div class="q-bottom-stack">
        <!-- shown after she responds — sits above the dialog, centered -->
        <div class="shuffle-stage" id="shuffle-stage" aria-hidden="true">
          <div class="shuffle-card" style="animation-delay: 0s"></div>
          <div class="shuffle-card" style="animation-delay: -0.4s"></div>
          <div class="shuffle-card" style="animation-delay: -0.8s"></div>
          <div class="shuffle-card" style="animation-delay: -1.2s"></div>
          <div class="shuffle-card" style="animation-delay: -1.6s"></div>
          <div class="shuffle-card" style="animation-delay: -2.0s"></div>
          <div class="shuffle-card" style="animation-delay: -2.4s"></div>
          <div class="shuffle-card" style="animation-delay: -2.8s"></div>
        </div>

        <div class="madame">
          <div class="avatar" aria-hidden="true"></div>
          <div>
            <div class="name">Madame Celandra</div>
            <div class="bubble" id="madame-intro"></div>
          </div>
        </div>

        <div class="q-input-wrap" id="q-input-wrap">
          <textarea id="question-input"
                    placeholder="Type your question, worry, or curiosity…"
                    maxlength="800"
                    aria-label="Your question"></textarea>
          <div class="btn-row">
            <button class="btn" id="ask-btn">Ask Madame Celandra</button>
          </div>
        </div>

        <div class="btn-row" id="continue-to-cards-row" style="display:none; margin-top: 10px;">
          <button class="btn" id="continue-to-cards">Continue to the Cards</button>
        </div>
      </div>
    </section>

    <!-- ══════════════════  3 · CARD SELECT SCREEN  ══════════════════ -->
    <section id="card-screen" class="screen" aria-label="Card selection">
      <div class="screen-bg select" aria-hidden="true"></div>
      <h2 id="card-heading">The Past</h2>

      <div class="drawn-row" id="drawn-dots" aria-hidden="true">
        <span class="drawn-dot"></span>
        <span class="drawn-dot"></span>
        <span class="drawn-dot"></span>
      </div>

      <div class="card-table">
        <!-- the deck (before pick) -->
        <div class="pick-prompt" id="pick-prompt">
          Tap the deck to draw your card
          <span class="step-count" id="step-count">Card 1 of 3 · The Past</span>
        </div>

        <div class="deck idle" id="deck" role="button" tabindex="0" aria-label="Draw a card">
          <div class="stack s1"></div>
          <div class="stack s2"></div>
          <div class="stack s3"></div>
        </div>

        <!-- the drawn card (after pick) -->
        <div class="card" id="drawn-card" style="display:none;">
          <div class="card-inner">
            <div class="card-face card-back" aria-hidden="true"></div>
            <div class="card-face card-front" id="drawn-card-front">
              <!-- image or fallback injected by JS — no overlays -->
            </div>
          </div>
        </div>

        <!-- name + reversed indicator sit BELOW the card so nothing obscures the art -->
        <div class="card-label" id="drawn-card-label" style="display:none;">
          <span class="cl-name"></span>
          <span class="cl-rev">reversed</span>
        </div>
      </div>

      <div class="madame" id="card-interp-wrap" style="display:none;">
        <div class="avatar" aria-hidden="true"></div>
        <div>
          <div class="name">Madame Celandra</div>
          <div class="bubble" id="card-interp"></div>
        </div>
      </div>

      <div class="btn-row" id="card-continue-row" style="display:none;">
        <button class="btn" id="card-continue-btn">Continue</button>
      </div>
    </section>

    <!-- ══════════════════  4 · SUMMARY SCREEN  ══════════════════ -->
    <section id="summary-screen" class="screen" aria-label="Your reading">
      <div class="screen-bg select" aria-hidden="true"></div>
      <h1>Your Reading</h1>

      <div class="cards-row" id="summary-cards"></div>

      <!-- The full reading is rendered directly inside Madame's dialog box —
           same treatment as every other Madame box in the game. -->
      <div class="madame">
        <div class="avatar" aria-hidden="true"></div>
        <div>
          <div class="name">Madame Celandra</div>
          <div class="bubble reading-text" id="summary-text"></div>
        </div>
      </div>

      <div class="btn-row" style="margin-top: 16px;">
        <button class="btn" id="download-btn">Download</button>
        <button class="btn btn-ghost" id="restart-btn">Begin Again</button>
      </div>
    </section>
  </div>

  <script src="cards.js"></script>
  <script src="game.js"></script>
</body>
</html>
