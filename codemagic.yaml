workflows:
  # ── Amazon Appstore ──────────────────────────────────────────
  # Builds a signed APK. Download the artifact from Codemagic
  # and upload it manually to the Amazon Developer Console.
  android-amazon:
    name: Android APK (Amazon Appstore)
    max_build_duration: 60
    environment:
      android_signing:
        - madame_celandra_keystore
      groups:
        - madame_secrets          # holds MADAME_APP_KEY (must match APP_KEY in Cloudflare)
      node: 22.22.0
      vars:
        PACKAGE_NAME: "com.madamecelandra.app"
    scripts:
      - name: Check secrets
        script: |
          if [ -z "$MADAME_APP_KEY" ]; then
            echo "MADAME_APP_KEY is missing. Add it to the madame_secrets group in Codemagic."; exit 1
          fi
          if [ ! -f android/app/src/main/assets/AppstoreAuthenticationKey.pem ]; then
            echo "android/app/src/main/assets/AppstoreAuthenticationKey.pem is missing (download it from the Amazon Developer Console)."; exit 1
          fi
      - name: Install dependencies
        script: npm install
      - name: Build web assets into www/
        script: node build.js
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Build signed release APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk

  # ── Google Play (future) ─────────────────────────────────────
  # Kept for when a Google Play developer account is available.
  # Requires GCLOUD_SERVICE_ACCOUNT_CREDENTIALS env variable.
  android-google-play:
    name: Android AAB (Google Play)
    max_build_duration: 60
    environment:
      android_signing:
        - madame_celandra_keystore
      node: 22.22.0
      vars:
        PACKAGE_NAME: "com.madamecelandra.app"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets into www/
        script: node build.js
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
